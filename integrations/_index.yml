# McKesson integrations, recreated as Arazzo (roadmap#949). SCRIPT-OWNED: derive-integrations-index.py.
# One entry per integration the provider defines: from its own integrations page, its marketplace
# listings (integration-edges.yml) and the named workflow templates those listings publish.
# `arazzo` names the workflow that implements it; otherwise `status` says why there is none.
# The evidence is in mckesson-integration-edges.yml; the workflows are generated by API Evangelist.
- slug: mckesson-pci-security-standards-council-program-listings
  label: PCI Security Standards Council (program listings)
  partner_name: PCI Security Standards Council (program listings)
  category: Payment security validation
  type: register
  channel: standard-directory
  evidence: https://listings.pcisecuritystandards.org/assessors_and_solutions/payment_applications
  source: edge
  relationship: standard-participant
  contract_reference:
    register: PCI SSC program listings (listings.pcisecuritystandards.org / pcisecuritystandards.org)
    spec_file: null
    standard: PCI SSC
    role: pci-validated-vendor
    registered_name: McKesson Corporation
    website: www.mckesson.com/
    matched_domain: mckesson.com
    matched_by: domain
    identity_source: the vendor website on the PCI SSC listing (no lookup)
    certified_products:
    - product: PA-DSS Validated Payment Application
      lapsed: true
      latest_expiry: '2016-10-28'
      listed: 7
    signal_note: one certified_products entry per PCI SSC program (Secure Software, PA-DSS, P2PE solution / component
      / application, 3DS SDK, SPoC, CPoC, MPoC, PTS device, Secure SLC); lapsed = every listed product in that program
      is past its expiry / reassessment date or marked expired; `listed` is context only. List Access Agreement
      accepted on Kin's instruction 2026-10-20
    detected_by: sweep-compliance-assurance.py
    detected: '2026-10-20'
  status: not-a-workflow
  arazzo: null
